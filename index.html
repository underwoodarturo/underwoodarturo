<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Underwood</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Ephesis&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <script>
      // Handle theme initialization as early as possible to prevent flash
      let isDark = true;
      try {
        if (
          localStorage.getItem("theme") === "light" ||
          (!("theme" in localStorage) &&
            window.matchMedia("(prefers-color-scheme: light)").matches)
        ) {
          isDark = false;
        }
      } catch (e) {}
      if (isDark) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    </script>
  </head>
  <body>
    <div
      class="relative min-h-screen w-full overflow-hidden bg-background text-foreground selection:bg-accent/30"
    >
      <!-- Concrete noise grain overlay -->
      <div
        class="pointer-events-none absolute inset-0 opacity-[0.04] mix-blend-overlay"
        style="
          background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='https://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E&quot;);
        "
      ></div>

      <!-- Cast concrete lintel border -->
      <div
        class="pointer-events-none absolute inset-6 ring-1 ring-foreground/[0.08]"
      ></div>

      <!-- Top-left LinkedIn link -->
      <a
        href="https://linkedin.com/in/arturo-underwood"
        target="_blank"
        rel="noopener noreferrer"
        class="eyebrow group fixed top-12 left-12 z-20 text-muted-foreground transition-all duration-500 ease-out hover:tracking-[0.3em] hover:text-foreground"
      >
        <span
          class="relative z-10 inline-block transition-transform duration-500 ease-out group-hover:-translate-y-0.5"
        >
          LinkedIn
        </span>
        <span
          class="absolute -bottom-1.5 left-0 h-px w-0 bg-foreground transition-all duration-500 ease-out group-hover:w-full"
        ></span>
      </a>

      <!-- Top-right theme toggle -->
      <button
        id="theme-toggle"
        type="button"
        aria-label="Switch theme"
        class="group fixed top-12 right-12 z-20 flex h-9 w-9 items-center justify-center border border-foreground/15 text-muted-foreground transition-all duration-500 ease-out hover:border-foreground/40 hover:text-foreground hover:tracking-widest"
      >
        <span
          class="transition-transform duration-700 ease-out group-hover:rotate-180 group-active:scale-90"
        >
          <svg
            id="theme-icon-sun"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-4 w-4"
            style="display: none;"
          >
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2" />
            <path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" />
            <path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" />
            <path d="m19.07 4.93-1.41 1.41" />
          </svg>
          <svg
            id="theme-icon-moon"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="h-4 w-4"
            style="display: none;"
          >
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </span>
      </button>

      <!-- Centered wordmark -->
      <main
        class="relative z-10 flex min-h-screen items-center justify-center p-8"
      >
        <div class="group text-center">
          <h1
            class="wordmark animate-reveal text-[clamp(4rem,17vw,14rem)] select-none group-hover:-translate-y-1.5 group-hover:tracking-[0.03em] group-hover:[text-shadow:0_0_40px_color-mix(in_oklch,var(--color-foreground)_35%,transparent)]"
          >
            Underwood
          </h1>
        </div>
      </main>

      <!-- Subtle bottom gradient -->
      <div
        class="pointer-events-none absolute bottom-0 left-0 h-1/3 w-full bg-gradient-to-t from-foreground/[0.03] to-transparent"
      ></div>
    </div>

    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const iconSun = document.getElementById("theme-icon-sun");
      const iconMoon = document.getElementById("theme-icon-moon");

      function updateIcons() {
        const currentIsDark =
          document.documentElement.classList.contains("dark");
        if (currentIsDark) {
          iconSun.style.display = "block";
          iconMoon.style.display = "none";
          themeToggle.setAttribute("aria-label", "Switch to light theme");
        } else {
          iconMoon.style.display = "block";
          iconSun.style.display = "none";
          themeToggle.setAttribute("aria-label", "Switch to dark theme");
        }
      }

      updateIcons();

      themeToggle.addEventListener("click", () => {
        const currentIsDark =
          document.documentElement.classList.contains("dark");
        const nextIsDark = !currentIsDark;

        document.documentElement.classList.toggle("dark", nextIsDark);
        updateIcons();

        try {
          localStorage.setItem("theme", nextIsDark ? "dark" : "light");
        } catch (e) {}
      });
    </script>
  </body>
</html>
